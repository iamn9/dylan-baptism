<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baptism of Yann Dylan Garcia</title>
<meta name="description" content="Norman & Hannah invite you to the baptism of Yann Dylan Garcia, Saturday, December 12, 2026, 10:00 AM, Tacloban City.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide-react@0.383.0/dist/umd/lucide-react.min.js"></script>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config = { corePlugins: { preflight: false } };</script>
<style>
:root {
  --sky-top: #e8e5f7;
  --lavender: #d9d3f2;
  --sky-mid: #e6f0fa;
  --sky-low: #fbf7ef;
  --paper: #fffdf8;
  --ink: #3a4660;
  --soft: #66718a;
  --icy: #a9c8e8;
  --royal: #5a78b8;
  --royal-soft: #8fa9e0;
  --gold: #c9a35a;
  --gold-text: #9c7a35;
  --gold-light: #e9d9a6;
  --cloud: #ffffff;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body { margin: 0; min-height: 100%; }
body { background: var(--sky-low); color: var(--ink); font-family: "Nunito", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
.fun { font-family: "Fredoka", "Nunito", system-ui, sans-serif; }
p { margin: 0; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--royal); outline-offset: 3px; }

/* ---------- Scene ---------- */
.scene { position: relative; min-height: 100svh; display: grid; place-items: center; padding: 56px 16px 96px; box-sizing: border-box; overflow: hidden; }
.sky { position: absolute; inset: 0; background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-low) 100%); pointer-events: none; }
.bank { position: absolute; left: -10%; right: -10%; bottom: -70px; height: 170px; background: var(--cloud); border-radius: 50% 50% 0 0 / 100% 100% 0 0; opacity: 0.9; }

.cloud { position: absolute; color: var(--cloud); opacity: 0.95; animation: drift linear infinite; }
.c1 { left: 6%; top: 6%; animation-duration: 70s; animation-delay: -10s; }
.c2 { left: 60%; top: 30%; animation-duration: 90s; animation-delay: -55s; opacity: 0.8; }
.c3 { left: 30%; top: 58%; animation-duration: 110s; animation-delay: -30s; opacity: 0.85; }
.c4 { left: 70%; top: 80%; animation-duration: 80s; animation-delay: -65s; opacity: 0.7; }

.hab { position: absolute; top: 4%; left: 0; animation: cross 60s linear infinite; animation-delay: -18s; }
.hab svg { display: block; animation: bob 6s ease-in-out infinite; }

.balloon { position: absolute; bottom: -170px; animation: rise linear infinite; }
.balloon svg { display: block; animation: sway 5s ease-in-out infinite alternate; }
.bl1 { left: 3%; animation-duration: 17s; animation-delay: -2s; }
.bl2 { left: 11%; animation-duration: 21s; animation-delay: -12s; }
.bl3 { left: 20%; animation-duration: 19s; animation-delay: -7s; }
.bl4 { right: 18%; animation-duration: 20s; animation-delay: -15s; }
.bl5 { right: 9%; animation-duration: 16s; animation-delay: -4s; }
.bl6 { right: 2%; animation-duration: 23s; animation-delay: -9s; }

.dove { position: absolute; z-index: 2; opacity: 0; }
.dove svg { display: block; animation: hover 4s ease-in-out infinite; }
.dove .wing { transform-box: fill-box; transform-origin: 0% 100%; animation: flap 0.55s ease-in-out infinite alternate; }
.d1 { top: 12%; left: calc(50% - 330px); }
.d2 { top: 20%; left: calc(50% + 250px); scale: -1 1; }
.ready .d1 { animation: flyin1 3.2s cubic-bezier(0.2, 0.7, 0.2, 1) 0.4s forwards; }
.ready .d2 { animation: flyin2 3.2s cubic-bezier(0.2, 0.7, 0.2, 1) 0.9s forwards; }

.spark { position: absolute; animation: twinkle 3s ease-in-out infinite; }
.sp1 { top: 16%; left: 22%; } .sp2 { top: 40%; right: 16%; animation-delay: 0.8s; }
.sp3 { top: 70%; left: 14%; animation-delay: 1.6s; } .sp4 { top: 9%; right: 28%; animation-delay: 2.2s; }

/* ---------- Card ---------- */
.card { position: relative; z-index: 3; width: min(460px, 100%); background: var(--paper); border-radius: 230px 230px 20px 20px; padding: 12px; box-sizing: border-box; box-shadow: 0 24px 60px rgba(120, 110, 190, 0.18); opacity: 0; transform: translateY(30px) scale(0.97); transition: opacity 1s ease, transform 1.2s cubic-bezier(0.2, 0.7, 0.2, 1); }
.ready .card { opacity: 1; transform: none; }
.frame { border: 1.5px solid var(--gold); border-radius: 220px 220px 12px 12px; padding: 26px 26px 34px; text-align: center; }

.rv { opacity: 0; transform: translateY(16px); transition: opacity 0.9s ease, transform 0.9s cubic-bezier(0.2, 0.7, 0.2, 1); transition-delay: calc(var(--i, 0) * 140ms + 350ms); }
.ready .rv { opacity: 1; transform: none; }

.photo-wrap { position: relative; padding-bottom: 18px; }
.flowers { position: absolute; bottom: -22px; width: 150px; height: auto; z-index: 2; }
.fl-l { left: -10px; } .fl-r { right: -10px; }
.bloom { transform-box: fill-box; transform-origin: center; transform: scale(0); transition: transform 0.9s cubic-bezier(0.3, 1.5, 0.5, 1); }
.ready .bloom { transform: scale(1); }
.ready .b-1 { transition-delay: 0.9s; } .ready .b-2 { transition-delay: 1.1s; } .ready .b-3 { transition-delay: 1.3s; } .ready .b-4 { transition-delay: 1.5s; }
.ready .b-3 { animation: sway-soft 5s ease-in-out 2.5s infinite alternate; }
.arch { position: relative; width: 78%; margin: 0 auto; aspect-ratio: 3 / 4; border-radius: 999px 999px 14px 14px; overflow: hidden; background: var(--icy); box-shadow: 0 0 0 5px var(--paper), 0 0 0 6.5px var(--gold-light); }
.arch img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; opacity: 0; transform: scale(1.08); transition: opacity 1.4s ease, transform 6s ease; }
.arch img.on { opacity: 1; transform: scale(1); }
.dots { position: absolute; left: 0; right: 0; bottom: 6px; display: flex; justify-content: center; gap: 2px; }
.dots button { width: 32px; height: 32px; border: 0; background: none; display: grid; place-items: center; padding: 0; }
.dots button::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: rgba(255, 255, 255, 0.7); transition: transform 0.25s ease, background-color 0.25s ease; }
.dots button.on::before { background: #fff; transform: scale(1.35); }
.dots button:hover::before { transform: scale(1.35); }

.lead-in { margin-top: 22px; font-size: 1.05rem; line-height: 1.5; color: var(--soft); }
.lead-in strong { color: var(--ink); font-weight: 800; }
h1 { margin: 6px 0 0; font-weight: 500; line-height: 1; }
.title { display: block; font-family: "Fredoka", "Nunito", sans-serif; font-size: 1.35rem; color: var(--royal); font-weight: 600; letter-spacing: 0.02em; }
.name-art { position: relative; display: block; margin: 4px auto 0; width: 100%; max-width: 380px; padding-top: 40px; }
.sticker { display: block; width: 100%; height: auto; overflow: visible; }
.sticker text { font-family: "Fredoka", "Nunito", system-ui, sans-serif; font-weight: 700; letter-spacing: -0.5px; }
.sticker-text { transform-box: fill-box; transform-origin: center; transform: scale(0.6); opacity: 0; transition: transform 0.8s cubic-bezier(0.3, 1.6, 0.5, 1) 1s, opacity 0.4s ease 1s; }
.ready .sticker-text { transform: scale(1); opacity: 1; }
.ready .sticker { animation: wiggle 6s ease-in-out 3s infinite; }
.crown { position: absolute; top: 0; left: 50%; margin-left: -37px; transform: translateY(-30px) rotate(-14deg); opacity: 0; transition: transform 0.8s cubic-bezier(0.3, 1.7, 0.5, 1) 1.5s, opacity 0.3s ease 1.5s; }
.ready .crown { transform: none; opacity: 1; }
.deco { position: absolute; opacity: 0; transform: scale(0); transition: transform 0.6s cubic-bezier(0.3, 1.7, 0.5, 1), opacity 0.3s ease; }
.ready .deco { opacity: 1; transform: scale(1); }
.h-l { left: 0; top: 34px; transition-delay: 1.7s; } .h-r { right: 0; top: 34px; transition-delay: 1.8s; }
.st-l { left: 4px; bottom: 6px; transition-delay: 1.9s; } .st-r { right: 4px; bottom: 6px; transition-delay: 2s; }
.ready .h-l, .ready .h-r { animation: beat 2.4s ease-in-out 2.6s infinite; }
.ready .st-l, .ready .st-r { animation: spin-soft 6s ease-in-out 2.6s infinite; }
.dash { position: absolute; top: 46%; display: flex; flex-direction: column; gap: 10px; opacity: 0; transition: opacity 0.4s ease 2.1s; }
.ready .dash { opacity: 1; }
.dash i { display: block; width: 22px; height: 5px; border-radius: 4px; background: #f6d36b; }
.dash-l { left: -18px; } .dash-l i:first-child { transform: rotate(-18deg); } .dash-l i:last-child { transform: rotate(18deg); }
.dash-r { right: -18px; } .dash-r i:first-child { transform: rotate(18deg); } .dash-r i:last-child { transform: rotate(-18deg); }
@media (max-width: 420px) { .dash { display: none; } }

.ornament { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 6px 0 18px; }
.ornament span { width: 64px; height: 1px; background: var(--gold); }

.when { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 14px; }
.when-side { font-family: "Fredoka", "Nunito", sans-serif; font-size: 0.95rem; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 500; padding: 8px 0; border-top: 1px solid var(--gold-light); border-bottom: 1px solid var(--gold-light); }
.when-mid { display: flex; flex-direction: column; align-items: center; line-height: 1; }
.month, .year { font-family: "Fredoka", "Nunito", sans-serif; font-size: 0.95rem; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 500; }
.day { font-family: "Fredoka", "Nunito", sans-serif; font-size: 3.25rem; font-weight: 700; color: var(--royal); margin: 2px 0; }
.countdown { margin-top: 12px; font-weight: 700; font-size: 1rem; color: var(--gold-text); }

.place { margin-top: 22px; }
.label { font-family: "Fredoka", "Nunito", sans-serif; font-size: 1rem; color: var(--royal); font-weight: 600; }
.where { display: inline-block; font-size: 1.2rem; font-weight: 800; margin-top: 4px; line-height: 1.25; color: var(--ink); text-decoration: none; padding: 4px 6px; border-radius: 8px; transition: color 0.2s ease, background-color 0.2s ease, transform 0.2s ease; }
.where:hover { color: var(--royal); background: #eef3fb; transform: scale(1.03); }
.area { font-size: 1rem; color: var(--soft); margin-top: 2px; }
.note { font-size: 0.95rem; color: var(--gold-text); font-weight: 700; margin-top: 2px; }
.area a { display: inline-flex; align-items: center; gap: 3px; margin-left: 6px; color: var(--gold-text); font-weight: 600; text-decoration: underline; text-decoration-color: var(--gold-light); text-underline-offset: 3px; padding: 6px 2px; }
.area a:hover { text-decoration-color: currentColor; }

.reply { margin-top: 26px; font-size: 1.1rem; line-height: 1.5; padding-top: 18px; border-top: 1px solid var(--gold-light); }
.reply strong { color: var(--royal); font-weight: 700; }

@media (max-width: 760px) {
  /* a band of open sky above the card, and side gutters for the balloons */
  .scene { align-items: start; padding: 170px 30px 120px; }
  .card { width: 100%; border-radius: 180px 180px 16px 16px; padding: 10px; }
  .frame { padding: 18px 14px 26px; border-radius: 170px 170px 9px 9px; }

  .hab { top: 20px; } .hab svg { width: 92px; height: auto; }
  .d1 { left: 5%; top: 70px; } .d2 { left: auto; right: 7%; top: 112px; }
  .dove svg { width: 52px; height: auto; }
  .c1 { top: 2%; } .c2 { top: 9%; }

  .balloon svg { width: 30px; height: auto; }
  .bl1 { left: -4px; } .bl2 { left: 8px; } .bl5 { right: 6px; } .bl6 { right: -6px; }
  .bl3, .bl4 { display: none; }
  .sp1 { top: 128px; left: 30%; } .sp4 { top: 36px; right: 34%; }
  .sp2 { top: 46%; right: 3px; } .sp3 { top: 74%; left: 3px; }

  .arch { width: 76%; }
  .flowers { width: 118px; bottom: -18px; }
  .fl-l { left: -22px; } .fl-r { right: -22px; }
  .lead-in { font-size: 0.98rem; margin-top: 18px; }
  .title { font-size: 1.2rem; }
  .name-art { padding-top: 34px; }
  .crown { width: 62px; height: auto; margin-left: -31px; }
  .when { gap: 8px; }
  .when-side, .month, .year { font-size: 0.85rem; letter-spacing: 0.06em; }
  .day { font-size: 2.75rem; }
  .where { font-size: 1.1rem; }
  .reply { font-size: 1.02rem; }
}
@media (max-width: 370px) {
  .scene { padding-left: 22px; padding-right: 22px; }
}

/* ---------- Music ---------- */
.music { position: fixed; z-index: 40; top: calc(14px + env(safe-area-inset-top, 0px)); right: 14px; width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--gold); background: var(--paper); color: var(--royal); display: grid; place-items: center; transition: transform 0.2s ease; animation: fade-in 0.6s ease; }
.music:hover { transform: scale(1.08); }
.music.on::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid var(--lavender); animation: ring 2s ease-out infinite; }
.music.on svg { animation: beat 1.4s ease-in-out infinite; }

/* ---------- Envelope intro ---------- */
.intro { position: fixed; inset: 0; z-index: 50; overflow: hidden; display: grid; place-items: center; padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px); background: linear-gradient(180deg, var(--sky-top), var(--sky-low)); transition: opacity 1s ease, transform 1s ease; }
.intro .cloud { animation: none; }
.c-a { top: 10%; left: -40px; } .c-b { bottom: 8%; right: -60px; }
.intro.leaving { opacity: 0; transform: scale(1.08); pointer-events: none; }
.intro-inner { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 34px; padding-top: 100px; }
.intro-line { font-family: "Fredoka", "Nunito", sans-serif; font-size: 1.4rem; color: var(--soft); text-align: center; transition: opacity 0.5s ease, transform 0.5s ease; }
.gone { opacity: 0 !important; transform: translateY(10px) !important; pointer-events: none; }
.btn { display: inline-flex; align-items: center; gap: 8px; min-height: 50px; padding: 0 26px; border: 0; border-radius: 999px; background: var(--royal); color: #fff; font-family: "Fredoka", "Nunito", sans-serif; font-size: 1.1rem; font-weight: 600; transition: transform 0.2s ease, background-color 0.2s ease, opacity 0.5s ease; animation: breathe 2.4s ease-in-out infinite; }
.btn:hover { transform: scale(1.05); background: #4b68a6; }
.btn.gone { animation: none; }

.env { position: relative; width: min(330px, 84vw); height: 220px; perspective: 1100px; }
.env-back { position: absolute; inset: 0; border-radius: 6px; background: #e9dfcd; box-shadow: 0 20px 44px rgba(90, 110, 140, 0.2); }
.env-card { position: absolute; left: 6%; right: 6%; top: 10px; height: 200px; z-index: 2; background: var(--paper); display: flex; flex-direction: column; align-items: center; padding-top: 26px; text-align: center; transition: transform 1.1s cubic-bezier(0.3, 0.7, 0.2, 1) 0.7s; }
.env.open .env-card { transform: translateY(-136px); }
.env-small { font-family: "Fredoka", "Nunito", sans-serif; font-size: 1rem; color: var(--royal); font-weight: 500; }
.env-name { font-family: "Fredoka", "Nunito", sans-serif; font-weight: 700; font-size: 2.6rem; color: #7cb8ee; line-height: 1.15; -webkit-text-stroke: 1.5px #2f6db5; }
.env-front { position: absolute; inset: 0; z-index: 3; border-radius: 6px; background: #f6efe2; clip-path: polygon(0 0, 50% 56%, 100% 0, 100% 100%, 0 100%); }
.env-flap { position: absolute; left: 0; right: 0; top: 0; height: 60%; z-index: 4; transform-origin: top center; background: #efe5d3; clip-path: polygon(0 0, 100% 0, 50% 100%); transition: transform 0.9s cubic-bezier(0.4, 0.1, 0.2, 1), z-index 0s 0.35s; }
.env.open .env-flap { transform: rotateX(180deg); z-index: 1; }
.env-seal { position: absolute; left: 50%; top: calc(60% - 26px); margin-left: -26px; width: 52px; height: 52px; border-radius: 50%; z-index: 5; display: grid; place-items: center; background: var(--gold); box-shadow: 0 0 0 4px #e9d9a6; transition: opacity 0.3s ease, transform 0.3s ease; }
.env.open .env-seal { opacity: 0; transform: scale(0.4) rotate(40deg); }

/* ---------- Keyframes ---------- */
@keyframes drift { from { transform: translateX(-60vw); } to { transform: translateX(60vw); } }
@keyframes cross { from { transform: translateX(-160px); } to { transform: translateX(calc(100vw + 20px)); } }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-16px) rotate(2deg); } }
@keyframes rise { from { transform: translateY(0); } to { transform: translateY(calc(-100svh - 340px)); } }
@keyframes sway { from { transform: translateX(-10px) rotate(-4deg); } to { transform: translateX(10px) rotate(4deg); } }
@keyframes hover { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
@keyframes flap { from { transform: rotate(8deg); } to { transform: rotate(-28deg); } }
@keyframes flyin1 { from { opacity: 0; translate: -55vw 30vh; } 15% { opacity: 1; } to { opacity: 1; translate: 0 0; } }
@keyframes flyin2 { from { opacity: 0; translate: 55vw 26vh; } 15% { opacity: 1; } to { opacity: 1; translate: 0 0; } }
@keyframes twinkle { 0%, 100% { opacity: 0.2; transform: scale(0.6) rotate(0deg); } 50% { opacity: 1; transform: scale(1) rotate(45deg); } }
@keyframes shimmer { 0%, 100% { text-shadow: 0 0 0 rgba(233, 217, 166, 0); } 50% { text-shadow: 0 0 18px rgba(233, 217, 166, 0.9); } }
@keyframes wiggle { 0%, 90%, 100% { transform: rotate(0); } 93% { transform: rotate(-1.5deg); } 96% { transform: rotate(1.5deg); } }
@keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
@keyframes spin-soft { 0%, 100% { transform: rotate(0) scale(1); } 50% { transform: rotate(20deg) scale(1.1); } }
@keyframes sway-soft { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
@keyframes ring { from { transform: scale(0.9); opacity: 0.9; } to { transform: scale(1.35); opacity: 0; } }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; transition-delay: 0s !important; }
  .dove { opacity: 1; }
  .balloon { display: none; }
}

</style>
</head>
<body>
